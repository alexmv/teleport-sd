name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed to create the release and upload binaries

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: go.mod
          # Release builds are one-shot from a tagged commit; the build cache
          # adds nothing and would be a potential cache-poisoning vector.
          cache: false

      - name: Build linux/amd64
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags '-s -w' -o dist/teleport-sd-linux-amd64 .

      - name: Build linux/aarch64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags '-s -w' -o dist/teleport-sd-linux-aarch64 .

      - name: Generate checksums
        working-directory: dist
        run: sha256sum teleport-sd-linux-* > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --generate-notes \
            dist/teleport-sd-linux-amd64 \
            dist/teleport-sd-linux-aarch64 \
            dist/SHA256SUMS
